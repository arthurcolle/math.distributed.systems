name: Challenge or verify a result
description: Report a proof gap, replay result, source mismatch, or counterexample.
title: "Verify: "
labels: ["verification"]
body:
  - type: input
    id: target
    attributes:
      label: Exact theorem, card, or issue
      description: Link the statement and version being checked.
    validations:
      required: true
  - type: dropdown
    id: finding
    attributes:
      label: Finding type
      options:
        - Replayed successfully
        - Counterexample
        - Missing hypothesis or proof gap
        - Source or version mismatch
        - Verification request
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and reproduction steps
      description: Include exact commands, toolchain, and the smallest example you found.
    validations:
      required: true
